name: Build & Release RoutePilot APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment & Keystores
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'routepilot123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'routepilot123' }}
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=RoutePilot, OU=Mobile, O=RoutePilot, L=NewDelhi, S=Delhi, C=IN"
          fi

      - name: Build Signed RoutePilot Release & Debug APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'routepilot123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'routepilot123' }}
        run: |
          gradle assembleRelease assembleDebug
          cp app/build/outputs/apk/release/app-release.apk RoutePilot-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk RoutePilot-Debug.apk

      - name: Upload RoutePilot APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoutePilot-APK
          path: |
            RoutePilot-Release.apk
            RoutePilot-Debug.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RoutePilot-Release.apk
            RoutePilot-Debug.apk
